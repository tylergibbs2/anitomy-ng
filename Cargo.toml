[workspace]
resolver = "2"
members = ["anitomy", "anitomy-py", "anitomy-js", "anitomy-c"]
# Benchmark adapter for an external crate; its own workspace, built only by
# .github/workflows/benchmark.yml (see scripts/adapters/).
exclude = ["scripts/adapters/rapptz"]

[workspace.package]
version = "1.0.7"
edition = "2021"
# Floor for the published `anitomy-ng` crate, gated by `OnceLock` (1.70).
# The bindings need more and override this; see each of their manifests.
rust-version = "1.70"
license = "MPL-2.0"
repository = "https://github.com/tylergibbs2/anitomy-ng"
