name: Fuzz

on:
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: "300"
  schedule:
    - cron: "0 5 * * 0"

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [parse, parse_together]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install nightly --profile minimal --no-self-update
      # From source: the published Linux binary is musl-linked, and cargo-fuzz
      # defaults --target to its own build triple.
      - run: cargo install cargo-fuzz --locked
      # Carry the corpus between runs so coverage accumulates instead of
      # restarting from the fixture seeds every week.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: anitomy/fuzz/corpus/${{ matrix.target }}
          key: fuzz-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-${{ matrix.target }}-
      - run: scripts/fuzz.sh ${{ matrix.target }} ${{ inputs.seconds || 300 }}
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: anitomy/fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
