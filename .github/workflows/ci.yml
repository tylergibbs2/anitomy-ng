name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal --component clippy --no-self-update && rustup default stable
      # `--features cli` so the `anitomy` binary (gated behind that feature) is
      # linted too, not just the library.
      - run: cargo clippy -p anitomy-ng --all-targets --features cli -- -D warnings
      # Lint the wasm binding too (compiles natively for the check); the actual
      # wasm build + smoke test live in wasm.yml.
      - run: cargo clippy -p anitomy-js --all-targets -- -D warnings
      # anitomy-ng-py excluded: extension-module leaves libpython unlinked at
      # test time. Covered by python-test below.
      - run: cargo test --workspace --exclude anitomy-ng-py --features anitomy-ng/cli

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.70.0 --profile minimal --no-self-update && rustup default 1.70.0
      # Library only: the `cli` feature pulls clap, which needs a much newer
      # rustc, and the lockfile is v4 so it can't be used by this cargo.
      - run: rm -f Cargo.lock && cargo check -p anitomy-ng

  python-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - shell: bash
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - working-directory: anitomy-py
        run: uv run --extra test pytest tests/ -q

  dotnet-test:
    # Builds the C ABI natively, then runs the C# binding's tests against it —
    # this exercises the whole C#↔C-ABI↔Rust path on each OS (the per-OS native
    # library name is why `lib` differs). Packaging lives in nuget.yml.
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, lib: libanitomy.so }
          - { os: macos-latest, lib: libanitomy.dylib }
          - { os: windows-latest, lib: anitomy.dll }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - shell: bash
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"
      - run: cargo build -p anitomy-ng-c --release
      - run: >
          dotnet test bindings/csharp/AnitomyNg.Tests/AnitomyNg.Tests.csproj -c Release
          -p:NativeLib=${{ github.workspace }}/target/release/${{ matrix.lib }}
